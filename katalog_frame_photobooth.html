<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Frame - Didalam Potret</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Family Inter & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            100: '#e0ebff',
                            500: '#0052a5', // Warna Biru Didalam Potret
                            600: '#004287',
                            700: '#0d3b66',
                            dark: '#0a192f'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Aspect Ratio khusus untuk strip photobooth vertikal */
        .aspect-strip {
            aspect-ratio: 2 / 3;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Header & Navigation -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo Didalam Potret -->
                <div class="flex items-center gap-3">
                    <img src="img/Logo_DidalamPotret.png" alt="Didalam Potret Logo" class="h-8 sm:h-10 md:h-12 w-auto object-contain">
                </div>

                <!-- Contact / Call to Action -->
                <a href="https://www.instagram.com/didalam.potret/" target="_blank" class="inline-flex items-center gap-2 bg-gradient-to-r from-[#f9ce34] via-[#ee2a7b] to-[#6228d7] hover:opacity-90 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm hover:shadow-md hover:scale-105">
                    <i class="fa-brands fa-instagram text-lg"></i>
                    <span class="hidden sm:inline">Follow Us</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-gradient-to-b from-white via-slate-50 to-slate-100 py-10 sm:py-14 border-b border-slate-200/60">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <span class="inline-block px-4 py-1.5 rounded-full bg-brand-50 text-brand-600 text-xs font-bold tracking-wide uppercase mb-3 border border-brand-100">Our Collection</span>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">Choose Your Photobooth Frame</h1>
            <p class="mt-3 text-slate-600 text-sm sm:text-base max-w-xl mx-auto">Pick your favorite Didalam Potret frame for your special moments.</p>
        </div>
    </section>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <!-- Frame Grid (Flexibel & Responsive) -->
        <div id="frameGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <!-- Items akan di-generate oleh JavaScript -->
        </div>
    </main>

    <!-- Modal Detail Frame / Preview -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeModalOnBackdrop(event)">
        <div class="bg-white rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl transition-all transform scale-95 opacity-0 duration-200 relative" id="modalCard">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-slate-800 text-sm">Preview Frame</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white hover:bg-slate-200 border border-slate-200 flex items-center justify-center text-slate-500 transition-all">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- Modal Body / Frame Preview -->
            <div class="p-5 bg-slate-100 flex justify-center items-center">
                <div class="relative bg-white p-2 rounded-2xl shadow-md border border-slate-200 max-h-[70vh] overflow-hidden flex items-center justify-center">
                    <img id="modalImage" src="" alt="Frame Preview" class="max-h-[65vh] w-auto object-contain rounded-lg">
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 bg-white border-t border-slate-100 flex gap-2">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50 transition-all">Close</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="font-extrabold text-brand-500 text-base mb-1">DIDALAM POTRET PHOTOBOOTH</div>
            <p class="text-xs text-slate-400">&copy; 2026 Didalam Potret. All rights reserved.</p>
        </div>
    </footer>

    <!-- Script Data & Logic -->
    <script>
        /*
          PETUNJUK UPLOAD FRAME:
          Cukup ganti URL gambar di bawah ini dengan file PNG frame milik Anda.
          Contoh: "image": "images/frame1.png" atau "https://domain-anda.com/frame1.png"
        */
        const framesData = [
            { id: 1, image: "img/1.png" },
            { id: 2, image: "img/2.png" },
            { id: 3, image: "img/3.png" },
            { id: 4, image: "img/4.png" },
            { id: 5, image: "img/5.png" },
            { id: 6, image: "img/6.png" },
            { id: 7, image: "img/7.png" },
            { id: 9, image: "img/9.png" },
            { id: 10, image: "img/10.png" },
            { id: 11, image: "img/11.png" },
            { id: 12, image: "img/12.png" },
            { id: 13, image: "img/13.png" },
            { id: 14, image: "img/14.png" },
            { id: 15, image: "img/15.png" },
            { id: 16, image: "img/16.png" },
            { id: 17, image: "img/17.png" },
            { id: 18, image: "img/18.png" },
            { id: 19, image: "img/19.png" },
            { id: 20, image: "img/20.png" },
            { id: 21, image: "img/21.png" },
            { id: 22, image: "img/22.png" },
            { id: 23, image: "img/23.png" },
            { id: 24, image: "img/24.png" },
            { id: 25, image: "img/25.png" },
            { id: 26, image: "img/26.png" },
            { id: 27, image: "img/27.png" },
            { id: 28, image: "img/28.png" },
            { id: 29, image: "img/29.png" },
            { id: 30, image: "img/30.png" },
            { id: 31, image: "img/31.png" },
            { id: 32, image: "img/32.png" },
            { id: 33, image: "img/33.png" },
            { id: 34, image: "img/34.png" },
            { id: 35, image: "img/35.png" },
            { id: 36, image: "img/36.png" },
            { id: 37, image: "img/37.png" },
            { id: 38, image: "img/38.png" },
            { id: 39, image: "img/39.png" },
            { id: 40, image: "img/40.png" },
            { id: 41, image: "img/41.png" },
        ];

        // Render Semua Frame ke dalam Grid
        function renderFrames() {
            const grid = document.getElementById('frameGrid');
            grid.innerHTML = '';

            framesData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "group bg-white rounded-2xl p-2.5 sm:p-3 border border-slate-200/80 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col items-center";
                card.onclick = () => openModal(item, index + 1);

                card.innerHTML = `
                    <div class="relative w-full aspect-strip bg-slate-50 rounded-xl overflow-hidden border border-slate-100 flex items-center justify-center p-1">
                        <img src="${item.image}" alt="Frame Photobooth ${index + 1}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute inset-0 bg-brand-700/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span class="bg-white/95 text-brand-700 text-xs font-bold px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5">
                                <i class="fa-solid fa-eye text-brand-500"></i> Show Detail
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Fungsi Modal Preview Detail
        function openModal(item, frameNumber) {
            const modal = document.getElementById('detailModal');
            const modalCard = document.getElementById('modalCard');
            
            document.getElementById('modalImage').src = item.image;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-95', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            const modalCard = document.getElementById('modalCard');
            
            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function closeModalOnBackdrop(event) {
            if (event.target.id === 'detailModal') {
                closeModal();
            }
        }

        // Jalankan saat halaman dimuat
        window.onload = () => {
            renderFrames();
        };
    </script>
</body>
</html>
